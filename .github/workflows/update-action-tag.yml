name: Update Action tag

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  update:
    name: Move the major Action tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_IS_PRERELEASE: ${{ fromJson(inputs.plan).announcement_is_prerelease }}
    steps:
      - name: Move the major Action tag
        shell: bash
        run: |
          if [[ "$RELEASE_IS_PRERELEASE" == true || ! "$RELEASE_TAG" =~ ^v?([0-9]+)\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not moving a major tag for prerelease or non-SemVer tag $RELEASE_TAG"
            exit 0
          fi

          major_tag="v${BASH_REMATCH[1]}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major_tag" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major_tag" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major_tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          echo "Moved $major_tag to $GITHUB_SHA"
