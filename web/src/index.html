<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lintmatter</title>
<style>
  :root {
    color-scheme: light dark;
    /* The score bands, mirroring score_color in src/report/text.rs. */
    --score-green: #15803d;
    --score-yellow: #a16207;
    --score-orange: #c2410c;
    --score-red: #b91c1c;
  }
  /* The page follows the OS theme, so the bands need a lighter set to stay
     legible on a dark background. */
  @media (prefers-color-scheme: dark) {
    :root {
      --score-green: #4ade80;
      --score-yellow: #facc15;
      --score-orange: #fb923c;
      --score-red: #f87171;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }

  .site-header {
    background: color-mix(in srgb, currentColor 4%, transparent);
    border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent);
  }
  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 1.1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: inherit;
    text-decoration: none;
  }
  .wordmark::before {
    content: "";
    width: 0.65rem;
    height: 0.65rem;
    border-radius: 2px;
    background: #2563eb;
  }
  .repo-link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: #767676;
    text-decoration: none;
    font-size: 0.9rem;
  }
  .repo-link:hover { color: inherit; }
  .repo-link svg { width: 1.15rem; height: 1.15rem; }

  main { max-width: 860px; margin: 0 auto; padding: 1.75rem 1.25rem 3rem; }

  p.lede { color: #767676; margin-top: 0; max-width: 56ch; }

  .features { margin: 1.5rem 0 2rem; }
  .features-label, .score-label {
    display: block;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #767676;
    margin-bottom: 0.6rem;
  }
  .features ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .features li {
    display: flex;
    align-items: flex-start;
    gap: 0.55rem;
    font-size: 0.95rem;
  }
  .features svg {
    width: 1.1rem;
    height: 1.1rem;
    flex: none;
    margin-top: 0.1rem;
    color: #2563eb;
  }

  form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
  .input-wrap { position: relative; flex: 1; }
  .input-wrap svg {
    position: absolute;
    left: 0.6rem;
    top: 50%;
    transform: translateY(-50%);
    width: 1.1rem;
    height: 1.1rem;
    color: #767676;
    pointer-events: none;
  }
  input[type="url"] {
    width: 100%;
    padding: 0.5rem 0.7rem 0.5rem 2.2rem;
    font-size: 1rem;
    border: 1px solid #999;
    border-radius: 6px;
  }
  button {
    padding: 0.5rem 1.1rem;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #93b4f0; cursor: default; }
  #status { margin: 1rem 0; }
  #status.error { color: #b91c1c; }

  /* The run's score, first thing in the results. */
  .score-card {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 1.5rem;
    margin: 1.5rem 0;
    padding: 1.1rem 1.25rem;
    background: color-mix(in srgb, currentColor 4%, transparent);
    border: 1px solid color-mix(in srgb, currentColor 14%, transparent);
    border-radius: 6px;
  }
  .score-label { margin-bottom: 0.35rem; }
  .score-value {
    display: block;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 2.75rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--score-band);
  }
  .score-out-of { font-size: 1rem; font-weight: 400; color: #767676; }
  .score-band-label {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--score-band);
  }
  .score-meta { color: #767676; font-size: 0.9rem; }

  .score-badge {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.75rem;
    font-weight: 700;
    line-height: 1;
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    color: var(--score-band);
    background: color-mix(in srgb, var(--score-band) 14%, transparent);
  }

  .score-green { --score-band: var(--score-green); }
  .score-yellow { --score-band: var(--score-yellow); }
  .score-orange { --score-band: var(--score-orange); }
  .score-red { --score-band: var(--score-red); }

  /* Token budgets. Collapsed by default: the common case is one URL and one
     button, and the limits only matter once a repository disagrees with
     them. */
  .budgets {
    margin: -0.75rem 0 1.5rem;
    border: 1px solid color-mix(in srgb, currentColor 14%, transparent);
    border-radius: 6px;
    font-size: 0.9rem;
  }
  .budgets summary {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .budgets[open] summary {
    border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent);
  }
  .budgets-body { padding: 0.9rem; }
  .budget-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
    gap: 0.75rem;
  }
  .budget-field {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    font-size: 0.85rem;
  }
  /* Muted on the caption only: the value has to stay at full contrast, and an
     input inheriting a dimmed label would read as disabled. */
  .budget-field span { color: #767676; }
  input[type="number"] {
    width: 100%;
    padding: 0.4rem 0.5rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.95rem;
    color: inherit;
    background: transparent;
    border: 1px solid #999;
    border-radius: 6px;
  }
  .budgets-actions { margin-top: 0.9rem; }
  .link-button {
    padding: 0;
    background: none;
    color: #2563eb;
    font-size: 0.85rem;
    text-decoration: underline;
  }
  .link-button:disabled { background: none; color: #767676; }
  /* Says a run will not use the defaults, so a collapsed panel cannot hide
     that the score was measured against something else. */
  .budgets-custom {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.15rem 0.35rem;
    border-radius: 4px;
    color: #767676;
    background: color-mix(in srgb, currentColor 10%, transparent);
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #e0e0e0; vertical-align: top; }
  th { color: #555; font-weight: 600; }
  tr.error td.severity { color: #b91c1c; font-weight: 600; }
  tr.warning td.severity { color: #b45309; font-weight: 600; }
  .file-group { margin-top: 1.5rem; }
  .file-group h3 {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.3rem;
    font-size: 1rem;
    font-family: monospace;
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <span class="wordmark">lintmatter</span>
    <a class="repo-link" href="https://github.com/rsn491/lintmatter" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      Source
    </a>
  </div>
</header>

<main>
  <p class="lede">A linter for agent context files: AGENTS.md, skills, etc.; ensuring they're properly formatted and follow best practices.</p>

  <div class="features">
    <span class="features-label">Features</span>
    <ul>
      <li>
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-8 8a1 1 0 01-1.4 0l-4-4a1 1 0 111.4-1.4L8 12.6l7.3-7.3a1 1 0 011.4 0z" clip-rule="evenodd"/></svg>
        Detects broken references
      </li>
      <li>
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-8 8a1 1 0 01-1.4 0l-4-4a1 1 0 111.4-1.4L8 12.6l7.3-7.3a1 1 0 011.4 0z" clip-rule="evenodd"/></svg>
        Validates skill frontmatter
      </li>
      <li>
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-8 8a1 1 0 01-1.4 0l-4-4a1 1 0 111.4-1.4L8 12.6l7.3-7.3a1 1 0 011.4 0z" clip-rule="evenodd"/></svg>
        Validates token budgets for skills and AGENTS.md
      </li>
    </ul>
  </div>

  <form id="lint-form">
    <div class="input-wrap">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <input type="url" id="url" name="url" placeholder="https://github.com/owner/repo" required>
    </div>
    <button type="submit" id="submit-btn">Lint</button>
  </form>

  <details class="budgets" id="budgets">
    <summary>
      Token budgets
      <span class="budgets-custom" id="budgets-custom" hidden>customized</span>
    </summary>
    <div class="budgets-body">
      <div class="budget-grid">
        <label class="budget-field">
          <span>AGENTS.md content</span>
          <input type="number" id="max_agents_tokens" form="lint-form" inputmode="numeric" step="1">
        </label>
        <label class="budget-field">
          <span>SKILL.md content</span>
          <input type="number" id="max_skill_tokens" form="lint-form" inputmode="numeric" step="1">
        </label>
        <label class="budget-field">
          <span>Skill name</span>
          <input type="number" id="max_skill_name_tokens" form="lint-form" inputmode="numeric" step="1">
        </label>
        <label class="budget-field">
          <span>Skill description</span>
          <input type="number" id="max_skill_description_tokens" form="lint-form" inputmode="numeric" step="1">
        </label>
      </div>
      <div class="budgets-actions">
        <button type="button" class="link-button" id="reset-budgets" disabled>Reset</button>
      </div>
    </div>
  </details>

  <div id="status"></div>
  <div id="results"></div>
</main>

<script>
const form = document.getElementById('lint-form');
const urlInput = document.getElementById('url');
const submitBtn = document.getElementById('submit-btn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const budgetsEl = document.getElementById('budgets');
const budgetsCustomEl = document.getElementById('budgets-custom');
const resetBudgetsBtn = document.getElementById('reset-budgets');

// The token budgets, substituted in by the server from lintmatter's own defaults
// (src/config.rs) and its ceiling on a budget. The form therefore opens on
// exactly what a bare `lintmatter` run enforces, with nothing restated here to
// drift from it.
const BUDGET_SETTINGS = {{BUDGET_SETTINGS}};

// Each budget's input, keyed by the field name `/lint` expects. Driven by the
// defaults so a budget the server knows about cannot quietly lose its input.
const budgetInputs = new Map(
  Object.keys(BUDGET_SETTINGS.defaults).map(key => [key, document.getElementById(key)])
);

// The score bands, mirroring score_color in src/report/text.rs so the web
// report reads a score exactly as the CLI does. Ordered high to low; the
// labels come from that function's doc comment.
const SCORE_BANDS = [
  { min: 90, cls: 'score-green', label: 'Healthy' },
  { min: 70, cls: 'score-yellow', label: 'Worth a look' },
  { min: 50, cls: 'score-orange', label: 'Needs work' },
  { min: 0, cls: 'score-red', label: 'Wants work' },
];

// A budget is a whole number of tokens the server will accept; anything else
// is a typo worth stopping on rather than rounding into a limit the user did
// not ask for. A blank field is not an error: it means the default.
function budgetValue(key) {
  const raw = budgetInputs.get(key).value.trim();
  if (raw === '') return BUDGET_SETTINGS.defaults[key];
  const n = Number(raw);
  const ok = Number.isInteger(n) && n >= 0 && n <= BUDGET_SETTINGS.max;
  return ok ? n : null;
}

function readBudgets() {
  const budgets = {};
  for (const key of budgetInputs.keys()) budgets[key] = budgetValue(key);
  return budgets;
}

function resetBudgets() {
  for (const [key, input] of budgetInputs) {
    input.value = String(BUDGET_SETTINGS.defaults[key]);
  }
  syncBudgets();
}

// Keeps the panel honest while it is collapsed: the badge and the reset button
// both track whether this run would use the defaults.
function syncBudgets() {
  const custom = [...budgetInputs.keys()].some(
    key => budgetValue(key) !== BUDGET_SETTINGS.defaults[key]
  );
  budgetsCustomEl.hidden = !custom;
  resetBudgetsBtn.disabled = !custom;
}

for (const input of budgetInputs.values()) {
  input.min = 0;
  input.max = BUDGET_SETTINGS.max;
  input.addEventListener('input', syncBudgets);
  // The browser reports a field the form rejects by focusing it, which it
  // cannot do inside a collapsed panel: the submit would then be refused with
  // nothing on screen to say why. Open the panel so the message has somewhere
  // to point.
  input.addEventListener('invalid', () => { budgetsEl.open = true; });
}
resetBudgetsBtn.addEventListener('click', resetBudgets);
resetBudgets();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.className = '';

  // A backstop behind the inputs' own min/max: the server rejects a budget
  // outside the range outright, so it is better caught here than as a failed
  // run after a clone.
  const budgets = readBudgets();
  const badKey = [...budgetInputs.keys()].find(key => budgets[key] === null);
  if (badKey !== undefined) {
    budgetsEl.open = true;
    budgetInputs.get(badKey).focus();
    statusEl.className = 'error';
    statusEl.textContent =
      `Token budgets must be whole numbers from 0 to ${BUDGET_SETTINGS.max} (0 turns that check off).`;
    return;
  }

  statusEl.textContent = 'Cloning and linting…';
  resultsEl.innerHTML = '';
  submitBtn.disabled = true;

  try {
    const res = await fetch('/lint', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: urlInput.value.trim(), budgets }),
    });
    // A rejection that never reached the handler (a malformed body, say) is
    // not JSON, and a parse error there would bury the status code.
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(body.error || `request failed with status ${res.status}`);
    }
    statusEl.textContent = '';
    renderReport(body);
  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
  }
});

// A score the report did not carry is not worth guessing at: return null so
// callers can leave the widget out rather than render a NaN.
function normalizeScore(score) {
  const n = Number(score);
  if (!Number.isFinite(n)) return null;
  return Math.min(100, Math.max(0, Math.floor(n)));
}

function scoreBand(score) {
  return SCORE_BANDS.find(b => score >= b.min) ?? SCORE_BANDS[SCORE_BANDS.length - 1];
}

function renderReport(report) {
  const s = report.summary || {};
  resultsEl.appendChild(scoreCard(s));

  // A file with nothing to report is still worth listing when it did not
  // score a perfect 100, the same call TextReporter makes.
  const files = (report.files || [])
    .filter(f => (f.findings || []).length > 0 || (normalizeScore(f.score) ?? 100) < 100);
  if (files.length === 0) {
    const clean = document.createElement('p');
    clean.textContent = 'Nothing to report — every file scored 100.';
    resultsEl.appendChild(clean);
    return;
  }

  for (const file of files) {
    resultsEl.appendChild(fileGroup(file));
  }
}

// The run's score, leading the results: it is the one number that answers
// "how healthy is this repo's context?".
function scoreCard(summary) {
  const card = document.createElement('div');
  card.className = 'score-card';

  const score = normalizeScore(summary.score);
  if (score !== null) {
    const band = scoreBand(score);
    card.classList.add(band.cls);

    const headline = document.createElement('div');

    const label = document.createElement('span');
    label.className = 'score-label';
    label.textContent = 'Score';

    const value = document.createElement('span');
    value.className = 'score-value';
    value.textContent = String(score);
    const outOf = document.createElement('span');
    outOf.className = 'score-out-of';
    outOf.textContent = '/100';
    value.appendChild(outOf);

    const bandLabel = document.createElement('span');
    bandLabel.className = 'score-band-label';
    bandLabel.textContent = band.label;

    headline.append(label, value, bandLabel);
    card.appendChild(headline);
  }

  const files = summary.files ?? 0;
  const meta = document.createElement('div');
  meta.className = 'score-meta';
  meta.textContent =
    `${files} ${files === 1 ? 'file' : 'files'} checked · ` +
    `${summary.files_with_errors ?? 0} with errors · ` +
    `${summary.files_with_warnings ?? 0} with warnings`;
  card.appendChild(meta);

  return card;
}

function fileGroup(file) {
  const group = document.createElement('div');
  group.className = 'file-group';

  const heading = document.createElement('h3');
  const path = document.createElement('span');
  path.textContent = file.path;
  heading.appendChild(path);

  const score = normalizeScore(file.score);
  if (score !== null) {
    const badge = document.createElement('span');
    badge.className = `score-badge ${scoreBand(score).cls}`;
    badge.textContent = String(score);
    badge.title = `Score ${score} of 100`;
    heading.appendChild(badge);
  }
  group.appendChild(heading);

  const findings = file.findings || [];
  if (findings.length === 0) {
    return group;
  }

  const table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>Line</th><th>Severity</th><th>Rule</th><th>Message</th></tr></thead>';
  const tbody = document.createElement('tbody');
  for (const finding of findings) {
    const row = document.createElement('tr');
    row.className = finding.severity;
    row.innerHTML =
      `<td>${finding.line ?? ''}</td>` +
      `<td class="severity">${escapeHtml(finding.severity)}</td>` +
      `<td>${escapeHtml(finding.rule)}</td>` +
      `<td>${escapeHtml(finding.message)}</td>`;
    tbody.appendChild(row);
  }
  table.appendChild(tbody);
  group.appendChild(table);
  return group;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}
</script>
</body>
</html>
