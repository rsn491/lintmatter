name: Publish npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    # npm trusted publishing exchanges the GitHub OIDC token for a short-lived
    # publish credential, so no long-lived NPM_TOKEN secret is needed.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish packages
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --access public "./npm/${pkg}"
          done
