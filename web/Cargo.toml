[package]
name = "lintmatter-web"
version = "0.1.0"
publish = false
edition = "2024"

[package.metadata.dist]
dist = false

[dependencies]
axum = "0.8.9"
# For the default token budgets the UI starts from: they belong to the
# linter, so the page reads them from it rather than restating the numbers.
lintmatter = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "net"] }
