[workspace]
members = ["web"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Attribute and doc boilerplate with no bearing on correctness in a binary-first crate.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# Score and line-count arithmetic stays far below the widths where these casts misbehave.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# clap's Flags struct is one bool per CLI switch.
struct_excessive_bools = "allow"
similar_names = "allow"
mod_module_files = "warn"
cognitive_complexity = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
# Regex literals in statics use .expect(): the pattern is a constant, so a bare unwrap would say less.
expect_used = "allow"
panic = "warn"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"

[package]
name = "lintmatter"
version = "0.2.0"
publish = ["crates-io"]
edition = "2024"
rust-version = "1.93"
description = "A linter for agentic context"
repository = "https://github.com/rsn491/lintmatter"
homepage = "https://github.com/rsn491/lintmatter"
license = "MIT"

[lints]
workspace = true

[lib]
name = "lintmatter"
path = "src/lib.rs"

[[bin]]
name = "lintmatter"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
saphyr = "0.0.11"
regex = "1"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
terminal_size = "0.4"

[dev-dependencies]
# span-locations gives tests/architecture.rs line numbers for its findings.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", default-features = false, features = ["full", "parsing", "visit"] }
tempfile = "3"

[profile.release]
lto = true

[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew", "npm"]
# Publish prerelease tags to crates.io as prerelease versions too
publish-prereleases = true
# The crates.io publisher authenticates through GitHub OIDC
github-custom-job-permissions = { "publish-crate" = { contents = "read", id-token = "write" } }
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
github-custom-runners = { aarch64-apple-darwin = "macos-15" }
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# A GitHub repo to push Homebrew formulas to
tap = "rsn491/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "npm", "./publish-crate"]
# Don't run the release workflow on pull requests; ci.yml covers them
pr-run-mode = "skip"
