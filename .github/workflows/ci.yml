name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Action shell entrypoint
        run: .github/action/test.sh

      - name: Lint clean fixtures with the published CLI
        uses: ./
        with:
          no-config: true
          paths: |
            testdata/clean/AGENTS.md
            testdata/clean/skills

      - name: Lint broken fixtures
        id: broken
        continue-on-error: true
        uses: ./
        with:
          no-config: true
          paths: testdata/broken

      - name: Require broken fixtures to fail
        if: steps.broken.outcome != 'failure'
        run: |
          echo "The action unexpectedly accepted the broken fixtures" >&2
          exit 1

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # OIDC lets Codecov authenticate the upload without a CODECOV_TOKEN secret.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@61b160225e09dfa2ea62afd328f7c2eafb5d2e54 # cargo-llvm-cov
      - name: Measure coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true
