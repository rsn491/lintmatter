name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  action:
    name: GitHub Action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Action shell entrypoint
        run: .github/action/test.sh

      - name: Lint clean fixtures with the published CLI
        uses: ./
        with:
          no-config: true
          paths: |
            testdata/clean/AGENTS.md
            testdata/clean/skills

      - name: Lint broken fixtures
        id: broken
        continue-on-error: true
        uses: ./
        with:
          no-config: true
          paths: testdata/broken

      - name: Require broken fixtures to fail
        if: steps.broken.outcome != 'failure'
        run: |
          echo "The action unexpectedly accepted the broken fixtures" >&2
          exit 1

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pre-commit/action@v3.0.1

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Read the floor from Cargo.toml so the job can't drift from `rust-version`.
      - name: Read rust-version
        id: msrv
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lintmatter") | .rust_version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build and test on the MSRV
        run: |
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked

      # Fails when `rust-version` is lower than what the code needs.
      - uses: taiki-e/install-action@cargo-msrv

      - name: Verify rust-version is the true minimum
        run: cargo msrv verify

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # OIDC lets Codecov authenticate the upload without a CODECOV_TOKEN secret.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true
