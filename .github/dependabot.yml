version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # release.yml is generated by `dist generate`, and dist refuses to release
    # when the file drifts from its output; bump cargo-dist-version instead.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
